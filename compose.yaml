services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=local_secret_pass
      - DB_NAME=appdb
      - OMDB_API_KEY=${OMDB_API_KEY}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=local_secret_pass
      - MYSQL_DATABASE=appdb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-plocal_secret_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  