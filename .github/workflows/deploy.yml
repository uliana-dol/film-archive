name: FilmArchive Lab 2 CI / optional AWS deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filmarchive-production
  cancel-in-progress: false
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: |
          node --check src/server.js
          node --check src/worker.js
          node --check src/controllers/mediaController.js
  build-and-deploy:
    needs: syntax-and-tests
    if: vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: eu-north-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/filmarchive:$SHA" -t "$REGISTRY/filmarchive:latest" .
          docker push "$REGISTRY/filmarchive:$SHA"
          docker push "$REGISTRY/filmarchive:latest"
      - name: Refresh autoscaling instances (requires existing ASGs)
        run: |
          aws autoscaling start-instance-refresh --auto-scaling-group-name filmarchive-app-asg
          # Worker ASG may currently be scaled to zero; next created worker pulls :latest.
